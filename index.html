<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary SEO Meta Tags -->
    <title>Contexta | Contextual AI Editing & Writing Tool</title>
    <meta name="description" content="Refine your writing with localized contextual AI editing. Perfect for professionals, digital agencies, and content creators looking for precise localized language adjustments.">
    <meta name="keywords" content="Contextual AI editing software South Africa, local AI grammar tool, writing productivity assistant, text correction utility">
    <meta name="author" content="Contexta MVP">
    <meta name="language" content="English">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph (Social Media & Link Previews) -->
    <meta property="og:title" content="Contexta | Contextual AI Editing & Writing Tool">
    <meta property="og:description" content="Refine your writing with localized contextual AI editing. Perfect for professionals, digital agencies, and content creators.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://contexta.vercel.app/">
    <meta property="og:image" content="https://contexta.vercel.app/og-image.png">
    <meta property="og:site_name" content="Contexta">
    
    <!-- Twitter Card (Social Sharing) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Contexta | Contextual AI Editing & Writing Tool">
    <meta name="twitter:description" content="Professional AI writing tool for localized language refinement and editing.">
    <meta name="twitter:image" content="https://contexta.vercel.app/og-image.png">
    
    <!-- Additional SEO Enhancements -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <link rel="canonical" href="https://contexta.vercel.app/">
    
    <title>Contexta | Contextual AI Editing & Writing Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <h1 class="app-title">CONTEXTA</h1>
        <div class="app-subtitle">MVP v1.0 — Contextual AI Writing Tool</div>
    </header>

    <div class="container">
        <div id="editor" contenteditable="true">
            Type something here... double-click a word to analyze or highlight a paragraph to translate.
        </div>

        <div id="sidebar">
            <div class="sidebar-top">
                <h2 id="active-word-display">Assistant</h2>
                
                <div id="menu" style="display: none;">
                    <select id="language-select">
                        <option value="en">To English</option>
                        <option value="af">To Afrikaans</option>
                        <option value="zu">To isiZulu</option>
                        <option value="st">To Sesotho</option>
                    </select>

                    <button onclick="translateAndSwap()">Translate</button>
                    <button onclick="getDefinition()">Definition</button>
                    <button onclick="getEtymology()">Etymology</button>
                    <button onclick="smartSwap(prompt('Enter a synonym:'))">Smart Swap</button>
                </div>

                <div id="results-panel"></div>
            </div>

            <div class="brand-footer">
                 <img src="logo.jpg" alt="Company Logo" class="footer-logo">
            </div>
        </div> 
    </div> 

    <script src="script.js"></script>
</body>
</html>
